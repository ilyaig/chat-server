plugins {
    id 'java'
    id 'application'
}

group = 'chat'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'org.postgresql:postgresql:42.7.4'
}

application {
    mainClass = 'chat.Main'
}
